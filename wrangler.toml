name = "el-armario"
main = "src/worker.js"
compatibility_date = "2026-11-04"
# Permite que el proxy llegue al otro Worker mediante su URL pública workers.dev.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
API_ORIGIN = "https://el-armario-api.catalogotienda.workers.dev"
